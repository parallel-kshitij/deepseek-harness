name: Build linux-x64 packaged carrier

on:
  workflow_dispatch:
  push:
    branches: [ci/build-linux-x64-carrier, feat/child-session-events]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx tsx scripts/build-exe-for-python-sdk.ts --targets node24-linux-x64
      - name: Checksum
        run: |
          cd dist-exe
          sha256sum dsh-jsonrpc-agent-pkg-linux-x64 | tee dsh-jsonrpc-agent-pkg-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-jsonrpc-agent-pkg-linux-x64
          path: dist-exe/dsh-jsonrpc-agent-pkg-linux-x64*
          if-no-files-found: error
          compression-level: 0
